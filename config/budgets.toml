# Budgets in USD. Never raise a cap or budget without the founder's approval.

[run]
target_median = 15.00

# Per-run hard stops by tender size (anbud.stops). The plan the founder approved (parallel-inventing-candle, section
# "The build lane"):
#   "**Per-run hard stop:** it becomes size-tiered, since plan line 661 allows $20–60."
# Granskning's tier comes from its shared prefix: the prefix plan's estimate before the first call, then the prefix
# the map's first call measures. Kalkyl's comes from its own $0 dry-run estimate (the high end) times `margin`, before
# any paid call. A size at a tier's bound picks that tier; a size above the top tier gets the top tier. The largest
# pair was $45 + $15 = $60 per tender, the plan's top. Kalkyl's top tier is now $25, so the largest pair is
# $45 + $25 = $70: the founder approved it in chat on 27 Nov 2026, "$500 cap + calc to $25", after the exam's $0 pass
# showed every exam tender above Kalkyl's $15 tier. The monthly workspace cap is separate.
[[granskning_stops]]
tier = "S"
max_prefix_tokens = 150000
hard_stop = 20.00

[[granskning_stops]]
tier = "M"
max_prefix_tokens = 300000
hard_stop = 30.00

[[granskning_stops]]
tier = "L"
max_prefix_tokens = 450000 # the prefix budget below: a planned prefix never goes above it
hard_stop = 45.00

[kalkyl]
margin = 1.5 # times the dry run's high estimate; the same margin as [exam]

[[kalkyl_stops]]
tier = "S"
hard_stop = 3.00 # about $1-2.5 expected at the dev tender's size (plan section 7)

[[kalkyl_stops]]
tier = "M"
hard_stop = 8.00

[[kalkyl_stops]]
tier = "L"
hard_stop = 25.00 # founder-approved 27 Nov 2026 (see the comment above)

[baseline]
hard_stop = 10.00 # per old-engine baseline run; about $6 expected per dev tender (plan: Cross-engine baseline)
timeout_minutes = 90

[exam]
# Estimates before a paid exam (anbud eval heldout|prospective), from the dev tender's measured runs (26 Nov):
# Granskning $8.12 of model calls at a 124,831-token prefix; the old engine $1.77-1.87 at 83 pages. Each sealed
# tender's estimate scales with its own prep size, times the margin, and never above the engine's hard stop. The worst
# case is the sum of hard stops. Kalkyl's own dry run gives its estimate (its high end, times the margin).
granskning_usd_per_mtok_prefix = 65.0
baseline_usd_per_page = 0.022
margin = 1.5
# The exam counts Granskning dry runs whose estimated prefix is over the context window and over a large-prefix mark.
context_tokens = 1000000
large_prefix_tokens = 200000

# The shared prefix's budget in tokens, estimated from characters (anbud.granskning.budget). Selected documents beyond
# it become search-only (outline in the prefix, text by search): priority 3, then 2, then priority 1 without the AF
# and the contract, then those two, the largest first within each. Only if the fixed part and every document's outline
# alone exceed it does the run stop, before any paid call. Lines brought back from other trades' documents take at
# most `boundary_share` of it.
[prefix]
budget_tokens = 450000
boundary_share = 0.10

[schema_check]
hard_stop = 0.10

# Lens caps scale with the shared prefix size (tokens). Re-derived from measured p90 + 20% after the first runs. The
# tiers at 300k and 450k match the run's hard stops: a lens may spend a tenth of its tier's stop. A prefix above the
# top tier gets the top tier.
[[lens_tiers]]
max_prefix_tokens = 100000
max_turns = 8
max_usd = 1.50

[[lens_tiers]]
max_prefix_tokens = 150000
max_turns = 10
max_usd = 2.00

[[lens_tiers]]
max_prefix_tokens = 300000
max_turns = 12
max_usd = 3.00

[[lens_tiers]]
max_prefix_tokens = 450000
max_turns = 12
max_usd = 4.50

[verifier]
max_turns = 3
top_n = 25
sampled_below_cut = 3
