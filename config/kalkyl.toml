# Kalkyl in shadow (#73 R2 and R3). Never raise a cap without the founder's approval.
# Models: providers.toml [roles] kalkyl_extract and kalkyl_match. The run's hard stop: budgets.toml [kalkyl].

[catalog]
default = "estim-default" # ~/estim-anbud-data/catalogs/<name>.json

[chunks]
max_chars = 12000
max_quantity_lines = 30

[extract] # R2: one call per chunk, in parallel after the first has written the cache
effort = "medium"
max_tokens = 12000
max_turns = 2 # the submission, then one repair turn or one nudge
concurrency = 4

[match] # R3: posts R2 left without a usable catalog item, a constrained choice among catalog ids
effort = "medium"
max_tokens = 8000
batch_size = 60
