# Kalkyl in shadow (#73 R2 and R3). Never raise a cap without the founder's approval.
# Models: providers.toml [roles] kalkyl_extract and kalkyl_match. The run's hard stop: budgets.toml [[kalkyl_stops]].

[catalog]
default = "estim-default" # ~/estim-anbud-data/catalogs/<name>.json

[chunks]
max_chars = 12000
max_quantity_lines = 30

[extract] # R2: one call per chunk, in parallel after the first has written the cache
effort = "medium"
max_tokens = 12000
max_turns = 2 # the submission, then one repair turn or one nudge
follow_up = true # then one more turn, only for marked lines the answer left unresolved
concurrency = 4

[group_pass] # one turn per code group of the technical description nothing covers after R2, read twice (`group_pass`)
enabled = false # off: a rebuild of a run made without it stays a complete $0 replay; `anbud kalkyl --group-pass` turns it on

[second_reading] # leverage lines read again: a fresh sample of their chunk's first turn (`kalkyl.second_reading`)
enabled = false # off until a paid measurement; `anbud kalkyl --second-reading` turns it on for one run
share = 0.05 # a post this share of the sum or more is read again, as is every post multiplied by an object count

[match] # R3: posts R2 left without a usable catalog item, a constrained choice among catalog ids
effort = "medium"
max_tokens = 8000
batch_size = 60

[repetition] # hours per unit fall with repetition on one site; a customer's references/repetition.toml replaces this
# Tiers: [first unit, factor on hours], applied like tax brackets within one post, count units only.
# Placeholder values, not calibrated to any tender: the company replaces them with its own norm table.
label = "Estims standardantagande för serieeffekt (ej kundens normtabell)"
tiers = [[1, 1.0], [11, 0.9], [51, 0.85], [201, 0.8]]
