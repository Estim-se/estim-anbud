[project]
name = "anbud"
version = "0.0.1"
description = "Estim Anbud harness"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.8.0,<3",
    "defusedxml>=0.7.1",
    "openpyxl>=3.1.5",
    "pillow>=11",
    "pydantic>=2.9",
    "pypdfium2>=4.30",
]

[project.scripts]
anbud = "anbud.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.11.23,<0.12"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.11.23"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
